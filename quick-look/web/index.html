<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' blob: trivor-preview:; style-src 'self' 'unsafe-inline' trivor-preview:; img-src 'self' blob: data: trivor-preview:; connect-src 'self' blob: data: trivor-preview:; worker-src blob:; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Trivor Preview</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./preview.js"></script>
  </head>
  <body>
    <main id="preview" aria-busy="true">
      <div id="viewport"></div>
      <div id="status" role="status" aria-live="polite">
        <span id="spinner" aria-hidden="true"></span>
        <p id="status-title">Preparing preview…</p>
        <p id="status-detail"></p>
      </div>
      <div id="controls" hidden>
        <span id="hint"></span>
        <button id="fit" type="button">Fit</button>
      </div>
    </main>
  </body>
</html>
